<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빵지순례 피드</title>
<style>
  /* 시안 D: C안의 연분홍·민트 파스텔 + A안의 상단바 */
  :root {
    --cream: #fff3f0;
    --cream-deep: #bfe8d6;
    --paper: #ffffff;
    --crust: #ee7f9f;
    --crust-dark: #c94f74;
    --gold: #ffd66b;
    --butter: #fde3ea;
    --mint: #6ccaa6;
    --choco: #4a3535;
    --choco-soft: #8f6f6f;
    --line: 3px solid var(--choco);
    --radius-card: 40px;
    --sans: "HY견고딕", "HYGothic-Extra", "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --body: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --serif: "Nanum Myeongjo", "AppleMyungjo", "Batang", Georgia, serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--cream-deep);
    font-family: var(--body);
    color: var(--choco);
    display: flex;
    justify-content: center;
  }

  /* 한글 자간: 기본값은 넓어 보여서 전체적으로 살짝 좁힘 (버튼은 상속이 안 돼서 따로 지정) */
  body, button { letter-spacing: -0.03em; }

  /* 휴대폰 폭 화면 */
  .phone {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: var(--cream);
  }

  /* 상단 헤더 — A안 구조(차양 없음, 굵은 제목 + 기울인 명조 소개)에 C안 색 */
  .header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--cream);
    border-bottom: var(--line);
  }
  .header__logo { width: 44px; height: 44px; flex: none; }
  .header__logo ellipse:first-of-type { fill: var(--gold); stroke: var(--choco); }
  .header__logo ellipse:nth-of-type(2) { fill: var(--crust); }
  .header__logo circle { fill: var(--choco); }
  .header__logo path { stroke: var(--choco); }
  .header__name {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.05em;
  }
  .header__intro {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--choco-soft);
    margin-top: 2px;
  }

  /* 피드 */
  .feed {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 18px 12px 32px;
  }

  /* 게시물 카드 */
  .card {
    background: var(--paper);
    border: var(--line);
    border-radius: var(--radius-card);
    box-shadow: 5px 5px 0 var(--mint);
    overflow: hidden;
  }
  .card__head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px 12px;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: var(--line);
    background: var(--gold);
    display: grid;
    place-items: center;
    font-family: var(--sans);
    font-size: 16px;
    flex: none;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    height: 30px;
    padding: 0 14px;
    border: var(--line);
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 13px;
    background: var(--butter);
  }
  .chip--time {
    border: 0;
    background: var(--mint);
    color: var(--paper);
    font-family: var(--body);
    font-weight: 800;
  }
  .card__star {
    margin-left: auto;
    color: var(--crust);
    font-size: 26px;
    line-height: 1;
  }

  /* 사진 영역 */
  .media {
    position: relative;
    aspect-ratio: 1 / 1;
    margin: 0 12px;
    border: var(--line);
    border-radius: 28px;
    overflow: hidden;
    background: var(--butter);
  }
  .media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .media__count {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 4px 12px;
    border: var(--line);
    border-radius: 999px;
    background: var(--gold);
    font-family: var(--sans);
    font-size: 12px;
  }
  .dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 12px 0 0;
  }
  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 2.5px solid var(--choco);
    background: var(--paper);
  }
  .dot--active { background: var(--crust); }

  /* 본문 */
  .card__body { padding: 12px 20px 20px; }
  .card__content {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.6;
    white-space: pre-line;
    word-break: keep-all;
  }
  .card__content--clamp {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .more {
    margin-top: 8px;
    height: 28px;
    padding: 0 12px;
    border: 2.5px solid var(--choco);
    border-radius: 999px;
    background: var(--butter);
    font: inherit;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--crust-dark);
    cursor: pointer;
  }

  /* 무한 스크롤 상태 */
  .states {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 12px 40px;
  }
  .states__label {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--crust-dark);
    text-align: center;
    margin-bottom: 4px;
  }
  .state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 16px;
    border: 3px dashed var(--mint);
    border-radius: var(--radius-card);
    background: var(--paper);
    text-align: center;
    font-family: var(--sans);
    font-size: 15px;
  }
  .state--end { border: var(--line); background: var(--gold); box-shadow: 5px 5px 0 var(--crust); }
  .state--error { border: 3px solid var(--crust-dark); background: var(--butter); color: var(--crust-dark); }

  .loader { display: flex; gap: 8px; }
  .loader span {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: var(--line);
    background: var(--crust);
    animation: bounce 0.8s ease-in-out infinite;
  }
  .loader span:nth-child(2) { animation-delay: 0.12s; background: var(--gold); }
  .loader span:nth-child(3) { animation-delay: 0.24s; background: var(--mint); }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-10px) scale(1.1); }
  }

  .retry {
    height: 42px;
    padding: 0 22px;
    border: var(--line);
    border-radius: 999px;
    background: var(--mint);
    color: var(--paper);
    font: inherit;
    font-family: var(--sans);
    text-shadow: 1px 1px 0 var(--choco);
    box-shadow: 0 4px 0 var(--choco);
    cursor: pointer;
  }
  .retry:active { transform: translateY(4px); box-shadow: none; }

  .state__icon { font-size: 26px; color: var(--crust); line-height: 1; }
</style>
</head>
<body>
  <div class="phone">
    <header class="header">
      <!-- 레퍼런스의 빵 캐릭터를 단순화한 로고 -->
      <svg class="header__logo" viewBox="0 0 44 44" aria-hidden="true">
        <ellipse cx="22" cy="24" rx="18" ry="16" fill="#c8662b" stroke="#3a2416" stroke-width="2.5"/>
        <ellipse cx="22" cy="15" rx="8" ry="4" fill="#9a4a1c"/>
        <circle cx="17" cy="25" r="1.6" fill="#3a2416"/>
        <circle cx="27" cy="25" r="1.6" fill="#3a2416"/>
        <path d="M19 29 q3 3 6 0" fill="none" stroke="#3a2416" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1 class="header__name">빵지순례</h1>
        <p class="header__intro">우리 동네 빵집에서 만난 오늘의 빵을 사진으로 남겨요</p>
      </div>
    </header>

    <main class="feed" id="feed"></main>

    <section class="states" aria-label="무한 스크롤 상태 예시">
      <p class="states__label">✳ 상태 예시 (모양만)</p>

      <div class="state">
        <div class="loader" aria-hidden="true"><span></span><span></span><span></span></div>
        <p>다음 빵을 꺼내는 중…</p>
      </div>

      <div class="state state--end">
        <span class="state__icon" aria-hidden="true">✳</span>
        <p>오늘 빵은 여기까지예요</p>
      </div>

      <div class="state state--error">
        <p>빵이 타버렸어요. 다시 시도해 주세요</p>
        <button class="retry" type="button">다시 굽기</button>
      </div>
    </section>
  </div>

<script>
  // 요구사항의 게시물 항목(id, author, content, images, created_at)을 그대로 따른 예시 데이터
  const now = Date.now();
  const posts = [
    {
      id: 1,
      author: "소금빵러버",
      content: "망원동 골목 끝 작은 빵집. 소금빵이 나오는 오후 3시에 맞춰 갔어요.",
      images: [
        "https://picsum.photos/seed/croissant/600/600",
        "https://picsum.photos/seed/baguette/600/600",
        "https://picsum.photos/seed/oven/600/600",
        "https://picsum.photos/seed/butter/600/600",
        "https://picsum.photos/seed/flour/600/600",
      ],
      created_at: new Date(now - 1000 * 60 * 25).toISOString(),
    },
    {
      id: 2,
      author: "아침식빵",
      content: "출근길에 들른 단골집 우유식빵. 오늘도 따끈했어요.",
      images: ["https://picsum.photos/seed/morning/600/600"],
      created_at: new Date(now - 1000 * 60 * 60 * 3).toISOString(),
    },
    {
      id: 3,
      author: "빵지도그리는사람",
      content:
        "이번 주말엔 동네 빵집 다섯 곳을 돌았어요.\n" +
        "첫 번째 집은 사장님이 혼자 새벽 4시부터 반죽을 하신다는데, 바게트 겉이 정말 바삭하고 속은 쫀득했어요. " +
        "두 번째 집은 크림치즈 스콘이 유명해서 줄이 길었는데, 기다린 보람이 있었습니다. " +
        "세 번째 집은 새로 생긴 곳인데 앙버터가 버터를 아끼지 않아서 좋았고요. " +
        "네 번째, 다섯 번째 집은 다음 글에 이어서 남길게요.\n" +
        "다음 주에는 강 건너 동네까지 가볼 예정이에요. 추천해 주실 집 있으면 알려주세요!",
      images: ["https://picsum.photos/seed/bakerymap/600/600"],
      created_at: new Date(now - 1000 * 60 * 60 * 26).toISOString(),
    },
  ];

  function timeAgo(iso) {
    const min = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 60) return `${min}분 전`;
    const hour = Math.floor(min / 60);
    if (hour < 24) return `${hour}시간 전`;
    return `${Math.floor(hour / 24)}일 전`;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function renderMedia(images) {
    // 사진 1장: 사진만. 여러 장: 첫 장 + 몇 번째 사진인지 표시(넘기기 동작 없음)
    const img = `<img src="${images[0]}" alt="" loading="lazy">`;
    if (images.length === 1) return `<div class="media">${img}</div>`;

    const dots = images
      .map((_, i) => `<span class="dot${i === 0 ? " dot--active" : ""}"></span>`)
      .join("");
    return `
      <div class="media">
        ${img}
        <span class="media__count">1 / ${images.length}</span>
      </div>
      <div class="dots" aria-label="${images.length}장 중 1번째 사진">${dots}</div>`;
  }

  function renderCard(post) {
    const isLong = post.content.length > 80;
    return `
      <article class="card">
        <div class="card__head">
          <span class="avatar">${escapeHtml(post.author[0])}</span>
          <span class="chip">${escapeHtml(post.author)}</span>
          <span class="chip chip--time">${timeAgo(post.created_at)}</span>
          <span class="card__star" aria-hidden="true">✳</span>
        </div>
        ${renderMedia(post.images)}
        <div class="card__body">
          <p class="card__content${isLong ? " card__content--clamp" : ""}">${escapeHtml(post.content)}</p>
          ${isLong ? '<button class="more" type="button">더 보기</button>' : ""}
        </div>
      </article>`;
  }

  const feed = document.getElementById("feed");
  feed.innerHTML = posts.map(renderCard).join("");

  // 긴 글 펼치기/접기
  feed.addEventListener("click", (e) => {
    const btn = e.target.closest(".more");
    if (!btn) return;
    const content = btn.previousElementSibling;
    const clamped = content.classList.toggle("card__content--clamp");
    btn.textContent = clamped ? "더 보기" : "접기";
  });
</script>
</body>
</html>
